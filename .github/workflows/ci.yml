# Build, unit tests, MiniAccumulo integration tests and coverage on every push and pull request.
# Pushes to main also publish the coverage report to GitHub Pages:
#   https://dgreco.github.io/rya-ng/coverage/   (badge data: https://dgreco.github.io/rya-ng/badge.json)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build, test and measure coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPORT: rya.coverage/target/site/jacoco-aggregate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check the shell scripts
        run: |
          bash -n rya.loader/run.sh rya.loader/configure.sh rya.sparql/configure.sh
          rya.sparql/configure.sh --defaults --output "$RUNNER_TEMP/rya-sparql.sh"
          bash -n "$RUNNER_TEMP/rya-sparql.sh"
          RYA_ACCUMULO_PASSWORD='p\ä ss' rya.loader/configure.sh --defaults --output "$RUNNER_TEMP/client.properties"
          grep -qx 'auth.token=\\u0070\\u005c\\u00e4\\u0020\\u0073\\u0073' "$RUNNER_TEMP/client.properties"
          [ "$(stat -c %a "$RUNNER_TEMP/client.properties")" = 600 ]

      - name: Build and test
        run: mvn -B -ntp clean verify -Pcoverage

      - name: Summarize tests and coverage
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci_summary.py --jacoco-csv "$REPORT/jacoco.csv" --badge site/badge.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          retention-days: 14

      - name: Upload the coverage report
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ env.REPORT }}
          retention-days: 14

      - name: Upload the executable jars
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            rya.sparql/target/rya.sparql-*.jar
            rya.loader/target/rya.loader-*.jar
          retention-days: 7

      - name: Assemble the Pages site
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p site
          cp -R "$REPORT" site/coverage
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>rya-ng coverage</title>
          <meta http-equiv="refresh" content="0; url=coverage/">
          <a href="coverage/">Coverage report</a>
          EOF

      - name: Upload the Pages site
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    name: Publish the coverage report
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}coverage/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
