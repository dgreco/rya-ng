# Build, unit tests, integration tests and coverage on every push and pull request: the full build on Accumulo
# (build), and the integration tests again on an in-process HBase cluster (hbase).
# Pushes to main also publish the coverage report to GitHub Pages:
#   https://tripatha.org/coverage/   (badge data: /badge.json for coverage, /tests.json for tests; the front page is website/index.html)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Maven Central answers 429 Too Many Requests when GitHub's runners ask too often: retry, waiting
  # longer. Maven 3.9's resolver and Maven 4's spell the settings differently; each ignores the other's.
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=8 -Daether.connector.http.retryHandler.interval=10000
    -Daether.connector.http.retryHandler.serviceUnavailable=429,503
    -Daether.transport.http.retryHandler.count=8 -Daether.transport.http.retryHandler.interval=10000
    -Daether.transport.http.retryHandler.serviceUnavailable=429,503

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build, test and measure coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPORT: tripatha.coverage/target/site/jacoco-aggregate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # A cache of this job's own. setup-java's cache has one key for every job, saved once, by the
      # first to finish: the RocksDB job's, without JaCoCo, so the coverage build fetched it from
      # Maven Central on every run, and failed when Central rate-limited.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-

      - name: Check the shell scripts
        run: |
          # One file per bash -n: with several, it checks the first and passes the others to it as arguments.
          for f in tripatha.loader/run.sh tripatha.loader/configure.sh tripatha.sparql/configure.sh \
            tripatha.loader/bench.sh tripatha.loader/compare.sh tripatha.standalone/build-optimized.sh tripatha.standalone/smoke-test.sh \
            tripatha.hbase.coprocessor/generate-protos.sh; do
            bash -n "$f"
          done
          tripatha.sparql/configure.sh --defaults --output "$RUNNER_TEMP/tripatha-sparql.sh"
          bash -n "$RUNNER_TEMP/tripatha-sparql.sh"
          TRIPATHA_ACCUMULO_PASSWORD='p\ä ss' tripatha.loader/configure.sh --defaults --output "$RUNNER_TEMP/accumulo-client.properties"
          grep -qx 'auth.token=\\u0070\\u005c\\u00e4\\u0020\\u0073\\u0073' "$RUNNER_TEMP/accumulo-client.properties"
          [ "$(stat -c %a "$RUNNER_TEMP/accumulo-client.properties")" = 600 ]
          TRIPATHA_BACKEND=hbase TRIPATHA_HBASE_USER=tripatha tripatha.loader/configure.sh --defaults --output "$RUNNER_TEMP/hbase.properties"
          grep -qx 'hbase.conf.hbase.zookeeper.quorum=localhost' "$RUNNER_TEMP/hbase.properties"
          grep -qx 'hbase.user=tripatha' "$RUNNER_TEMP/hbase.properties"
          [ "$(stat -c %a "$RUNNER_TEMP/hbase.properties")" = 600 ]

      - name: Build and test
        run: mvn -B -ntp clean verify -Pcoverage

      - name: Summarize tests and coverage
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci_summary.py --jacoco-csv "$REPORT/jacoco.csv" --badge site/badge.json --tests-badge site/tests.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          retention-days: 14

      - name: Upload the coverage report
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ env.REPORT }}
          retention-days: 14

      - name: Upload the executable jars
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            tripatha.sparql/target/tripatha.sparql-*.jar
            tripatha.loader/target/tripatha.loader-*.jar
            tripatha.spark/target/tripatha.spark-*-job.jar
          retention-days: 7

      - name: Assemble the Pages site
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p site
          cp -R "$REPORT" site/coverage
          # tripatha.org's front page: the landing page in website/ (a self-contained page). The custom domain is a
          # setting of the repository's Pages, not a CNAME file, which a workflow's deploy ignores.
          cp -R website/. site/

      - name: Upload the Pages site
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  hbase:
    name: Integration tests on HBase
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # A cache of this job's own. setup-java's cache has one key for every job, saved once, by the
      # first to finish: the RocksDB job's, without JaCoCo, so the coverage build fetched it from
      # Maven Central on every run, and failed when Central rate-limited.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-

      - name: Build
        run: mvn -B -ntp install -DskipTests -DskipITs

      # The store, Sail, loader and endpoint ITs, with HBase counters summed by Tripatha's coprocessor (the default)...
      - name: Test on HBase (coprocessor counters)
        run: mvn -B -ntp verify -pl tripatha.test,tripatha.sail,tripatha.loader,tripatha.sparql -Dtripatha.test.backend=hbase

      # ...and the store-level ITs again with HBase increments, the mode for clusters without the coprocessor.
      - name: Test on HBase (increment counters)
        run: mvn -B -ntp verify -pl tripatha.test -Dtripatha.test.backend=hbase -Dtripatha.test.hbaseCounters=increment

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: hbase-test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          retention-days: 14

  rocksdb:
    name: Integration tests on RocksDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # A cache of this job's own. setup-java's cache has one key for every job, saved once, by the
      # first to finish: the RocksDB job's, without JaCoCo, so the coverage build fetched it from
      # Maven Central on every run, and failed when Central rate-limited.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-

      - name: Build
        run: mvn -B -ntp install -DskipTests -DskipITs

      # The backend's own tests, and the store, Sail, loader and endpoint ITs on it.
      - name: Test on RocksDB
        run: mvn -B -ntp verify -pl tripatha.rocksdb,tripatha.test,tripatha.sail,tripatha.loader,tripatha.sparql -Dtripatha.test.backend=rocksdb

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: rocksdb-test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          retention-days: 14

  native:
    name: Native executable (RocksDB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community

      # As in the other jobs: setup-graalvm's own cache is keyed on the POMs with no fallback, so a PR that
      # changed one downloaded everything from Maven Central, and failed when Central didn't answer.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-

      # The endpoint with the RocksDB backend only, compiled ahead of time.
      - name: Build the native executable
        run: mvn -B -ntp -Pnative -pl tripatha.standalone -am package -DskipTests -DskipITs

      # The Java ITs can't start it, so it is run and checked over HTTP.
      - name: Smoke test
        run: |
          tripatha.standalone/target/tripatha --tripatha.backend=rocksdb --tripatha.rocksdb.path="$RUNNER_TEMP/store" \
            --tripatha.text-index=true --tripatha.geo-index=true --tripatha.inference=true > "$RUNNER_TEMP/tripatha.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS 'http://localhost:8080/sparql?query=ASK%20%7B%7D' > /dev/null && break
            sleep 1
          done
          tripatha.standalone/smoke-test.sh http://localhost:8080 || { cat "$RUNNER_TEMP/tripatha.log"; exit 1; }

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: tripatha-linux-x64
          path: tripatha.standalone/target/tripatha
          retention-days: 14

  publish:
    name: Publish the coverage report
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}coverage/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
