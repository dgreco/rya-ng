# rya-ng SPARQL endpoint. Every setting can also be given as an environment variable,
# e.g. RYA_ACCUMULO_ZOOKEEPERS, or on the command line, e.g. --rya.table-prefix=myrya_.
server:
  port: 8080

rya:
  accumulo:
    # Path to an accumulo-client.properties file; if set, the four settings below are ignored.
    client-properties:
    instance: accumulo
    zookeepers: localhost:2181
    user: root
    password: secret
  table-prefix: rya_
  inference: false
  # How often the ontology is reloaded for inference.
  inference-refresh: 5m
  stats: true
  # Left-hand join rows looked up together in one batch scan; 1 turns batching off.
  join-batch-size: 1000
  sparql:
    # Most a request may read with (the Accumulo user must hold these). Empty: unlabeled data only.
    authorizations: []
    # Visibility label written on inserted statements. Empty: no label.
    default-visibility: ""
    allow-request-visibility: false
    query-timeout: 120s
