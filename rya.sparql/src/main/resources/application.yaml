# rya-ng SPARQL endpoint. Every setting can also be given as an environment variable,
# e.g. RYA_ACCUMULO_ZOOKEEPERS, or on the command line, e.g. --rya.table-prefix=myrya_.
server:
  port: 8080

rya:
  accumulo:
    # Path to an accumulo-client.properties file (rya.loader/configure.sh writes one). If set, the
    # settings below are ignored, except the password when the file has no auth.token.
    client-properties:
    instance: accumulo
    zookeepers: localhost:2181
    user: root
    # No default: pass it in the environment (RYA_ACCUMULO_PASSWORD), not on the command line.
    password:
  table-prefix: rya_
  inference: false
  # How often the ontology is reloaded for inference.
  inference-refresh: 5m
  stats: true
  # Left-hand join rows looked up together in one batch scan; 1 turns batching off.
  join-batch-size: 1000
  # Full-text index behind text:matches (string and language-tagged literals).
  text-index: false
  # Predicates whose literals are text-indexed. Empty: all of them.
  text-index-predicates: []
  # Geospatial index behind GeoSPARQL filters on geo:wktLiteral values.
  geo-index: false
  # At startup, build indexes that don't cover the stored statements yet (turned on over
  # existing data, or redefined). Needs an Accumulo user holding every visibility label.
  rebuild-indexes: false
  sparql:
    # Most a request may read with (the Accumulo user must hold these). Empty: unlabeled data only.
    authorizations: []
    # Visibility label written on inserted statements. Empty: no label.
    default-visibility: ""
    allow-request-visibility: false
    # Longest a query or update may run, unless the request asks for another limit with timeout=.
    query-timeout: 120s
    # Longest limit a request may ask for with timeout= (which it gives in seconds). 0: no limit.
    max-query-timeout: 30m
