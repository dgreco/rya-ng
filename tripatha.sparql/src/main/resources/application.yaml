# Tripatha SPARQL endpoint. Every setting can also be given as an environment variable,
# e.g. TRIPATHA_ACCUMULO_ZOOKEEPERS, or on the command line, e.g. --tripatha.table-prefix=mytripatha_.
server:
  port: 8080

tripatha:
  accumulo:
    # Path to an accumulo-client.properties file (tripatha.loader/configure.sh writes one). If set, the
    # settings below are ignored, except the password when the file has no auth.token.
    client-properties:
    instance: accumulo
    zookeepers: localhost:2181
    user: root
    # No default: pass it in the environment (TRIPATHA_ACCUMULO_PASSWORD), not on the command line.
    password:
  # With tripatha.backend=rocksdb: the directory of the store. One process at a time can open it.
  rocksdb:
    path:
  table-prefix: tripatha_
  inference: false
  # How often the ontology is reloaded for inference.
  inference-refresh: 5m
  stats: true
  # Left-hand join rows looked up together in one batch scan; 1 turns batching off.
  join-batch-size: 1000
  # Fetch the attributes a query reads for a batch of entities (joins and OPTIONALs on them) together.
  entity-prefetch: true
  # Merge joins of a star's constant patterns: a pattern up to this many times longer than the
  # star's shortest is read in subject order and intersected with it, instead of looked up per row.
  # 0 turns them off; unset takes the backend's figure (35 on Accumulo, 20 on HBase, 8 on RocksDB).
  # join-merge-ratio: 35
  # Merge joins read their lists in up to this many slices of the subject space, cut at the
  # store's split points and intersected on threads of their own; 1 reads them whole.
  # join-merge-slices: 4
  # A star pattern on its own (?x a :C) at least this long is read as a merge of one list: its
  # subjects only, in those slices. 0 leaves it to a plain scan.
  # join-merge-single: 10000
  # A batch of lookups whose ranges can't overlap (an entity chain's links) is read on this many
  # threads. Unset, the store's default: 4 on RocksDB, 1 on Accumulo and HBase.
  # join-lookup-threads: 4
  # An entity prefetch fetches its next window while the current one is joined. Unset, the
  # store's default: on for RocksDB, off for Accumulo and HBase.
  # join-prefetch-ahead: true
  # Full-text index behind text:matches (string and language-tagged literals).
  text-index: false
  # Predicates whose literals are text-indexed. Empty: all of them.
  text-index-predicates: []
  # Geospatial index behind GeoSPARQL filters on geo:wktLiteral values.
  geo-index: false
  # Entity index: each statement's subject filed under its predicate and object in a fixed number
  # of shards, so stars of constant patterns are intersected shard by shard. Off by default.
  entity-index: false
  # Its shard count, fixed when it is built: about one per 200M triples. Unset: the store's own.
  # entity-index-shards: 16
  # At startup, build indexes that don't cover the stored statements yet (turned on over
  # existing data, or redefined). Needs an Accumulo user holding every visibility label.
  rebuild-indexes: false
  sparql:
    # Most a request may read with (the Accumulo user must hold these). Empty: unlabeled data only.
    authorizations: []
    # Visibility label written on inserted statements. Empty: no label.
    default-visibility: ""
    allow-request-visibility: false
    # Longest a query or update may run, unless the request asks for another limit with timeout=.
    query-timeout: 120s
    # Longest limit a request may ask for with timeout= (which it gives in seconds). 0: no limit.
    max-query-timeout: 30m
    # Let requests be traced (trace= and the /sparql/trace stream): their plan and every Accumulo scan and write.
    allow-trace: true
